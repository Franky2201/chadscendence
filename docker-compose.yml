include:
    - path: apps/games/docker-compose.yml

services:
    db:
        container_name: ft_db
        image: postgres:17-alpine
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgresdata:/var/lib/postgresql/data
        networks:
            - ft_network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        container_name: ft_redis
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        networks:
            - ft_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        container_name: ft_backend
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
            #change target from development to final for production build
            target: development
            #target: final
        env_file: .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "3000:3000"
        volumes:
            - ./apps/backend/uploads:/app/apps/backend/uploads
        develop:
            watch:
                - action: sync
                  path: ./apps/backend/src
                  target: /app/apps/backend/src
                - action: sync
                  path: ./libs/types/src
                  target: /app/libs/types/src
                - action: rebuild
                  path: ./apps/backend/package.json
        networks:
            - ft_network
        restart: unless-stopped

    frontend:
        container_name: ft_frontend
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
            #change target from development to final for production build
            target: development
            #target: final
            args:
                DOMAIN_NAME: ${DOMAIN_NAME}
        env_file: .env
        depends_on:
            - backend
        ports:
            - "5173:5173"
        develop:
            watch:
                - action: sync
                  path: ./apps/frontend/src
                  target: /app/apps/frontend/src
                - action: sync
                  path: ./libs/types/src
                  target: /app/libs/types/src
                - action: rebuild
                  path: ./apps/frontend/package.json
        networks:
            - ft_network
        restart: unless-stopped

volumes:
    postgresdata:
    redisdata:

networks:
    ft_network:
        driver: bridge
