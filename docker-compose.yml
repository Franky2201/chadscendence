include:
    - path: apps/games/docker-compose.yml

services:
    db:
        container_name: ft_db
        image: postgres:17-alpine
        restart: unless-stopped
        ports:
            - "${POSTGRES_HOST_PORT:-5432}:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgresdata:/var/lib/postgresql/data
        networks:
            - ft_network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        container_name: ft_redis
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "${REDIS_HOST_PORT:-6380}:6379"
        volumes:
            - redisdata:/data
        networks:
            - ft_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        container_name: ft_backend
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
            #change target from development to final for production build
            target: ${BUILD_TARGET:-development}
            #target: final
        env_file: .env
        environment:
            - PORT=3000
            - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173,https://${DOMAIN_NAME:-localhost}}
            - BACKEND_URL=${BACKEND_URL:-http://localhost:3000}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "${BACKEND_PORT:-3000}:3000"
        volumes:
            - ./apps/backend/src:/app/apps/backend/src
            - ./apps/backend/uploads:/app/apps/backend/uploads
            - ./libs/types/src:/app/libs/types/src
        networks:
            - ft_network
        restart: unless-stopped

    frontend:
        container_name: ft_frontend
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
            #change target from development to final for production build
            target: ${BUILD_TARGET:-development}
            #target: final
            args:
                DOMAIN_NAME: ${DOMAIN_NAME}
        env_file: .env
        environment:
            - VITE_BACKEND_URL=${BACKEND_URL:-http://localhost:3000}
        depends_on:
            - backend
        ports:
            - "${FRONTEND_PORT:-5173}:5173"
        volumes:
            - ./apps/frontend/src:/app/apps/frontend/src
            - ./libs/types/src:/app/libs/types/src
        networks:
            - ft_network
        restart: unless-stopped

volumes:
    postgresdata:
    redisdata:

networks:
    ft_network:
        driver: bridge
